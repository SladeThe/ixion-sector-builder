<!DOCTYPE html>
<html xmlns='http://www.w3.org/1999/xhtml' lang='' xml:lang=''>
<head>
	<meta charset='utf-8' />
	<meta name='viewport' content='width=device-width, user-scalable=no' />
	<title>Ixion Builder</title>
	<style type='text/css'>

		body {
			touch-action: none;
			margin: 0;
			border: 0 none;
			padding: 0;
			text-align: center;
			background-color: black;
		}

		#canvas {
			display: block;
			margin: 0;
			color: white;
		}

		#canvas:focus {
			outline: none;
		}

		.godot {
			font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
			color: #e0e0e0;
			background-color: #3b3943;
			background-image: linear-gradient(to bottom, #403e48, #35333c);
			border: 1px solid #45434e;
			box-shadow: 0 0 1px 1px #2f2d35;
		}


		/* Status display
		 * ============== */

		#status {
			position: absolute;
			left: 0;
			top: 0;
			right: 0;
			bottom: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			/* don't consume click events - make children visible explicitly */
			visibility: hidden;
		}

		#status-progress {
			width: 366px;
			height: 7px;
			background-color: #38363A;
			border: 1px solid #444246;
			padding: 1px;
			box-shadow: 0 0 2px 1px #1B1C22;
			border-radius: 2px;
			visibility: visible;
		}

		@media only screen and (orientation:portrait) {
			#status-progress {
				width: 61.8%;
			}
		}

		#status-progress-inner {
			height: 100%;
			width: 0;
			box-sizing: border-box;
			transition: width 0.5s linear;
			background-color: #202020;
			border: 1px solid #222223;
			box-shadow: 0 0 1px 1px #27282E;
			border-radius: 3px;
		}

		#status-indeterminate {
			height: 42px;
			visibility: visible;
			position: relative;
		}

		#status-indeterminate > div {
			width: 4.5px;
			height: 0;
			border-style: solid;
			border-width: 9px 3px 0 3px;
			border-color: #2b2b2b transparent transparent transparent;
			transform-origin: center 21px;
			position: absolute;
		}

		#status-indeterminate > div:nth-child(1) { transform: rotate( 22.5deg); }
		#status-indeterminate > div:nth-child(2) { transform: rotate( 67.5deg); }
		#status-indeterminate > div:nth-child(3) { transform: rotate(112.5deg); }
		#status-indeterminate > div:nth-child(4) { transform: rotate(157.5deg); }
		#status-indeterminate > div:nth-child(5) { transform: rotate(202.5deg); }
		#status-indeterminate > div:nth-child(6) { transform: rotate(247.5deg); }
		#status-indeterminate > div:nth-child(7) { transform: rotate(292.5deg); }
		#status-indeterminate > div:nth-child(8) { transform: rotate(337.5deg); }

		#status-notice {
			margin: 0 100px;
			line-height: 1.3;
			visibility: visible;
			padding: 4px 6px;
			visibility: visible;
		}
	</style>
<link id='-gd-engine-icon' rel='icon' type='image/png' href='index.icon.png' />
<link rel='apple-touch-icon' href='index.apple-touch-icon.png'/>

</head>
<body>
	<canvas id='canvas'>
		HTML5 canvas appears to be unsupported in the current browser.<br />
		Please try updating or use a different browser.
	</canvas>
	<div id='status'>
		<div id='status-progress' style='display: none;' oncontextmenu='event.preventDefault();'><div id ='status-progress-inner'></div></div>
		<div id='status-indeterminate' style='display: none;' oncontextmenu='event.preventDefault();'>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
		</div>
		<div id='status-notice' class='godot' style='display: none;'></div>
	</div>

	<!-- Local adaptation: file:// pages cannot fetch() sibling files, so the two game payloads
	     are loaded as script-tag data URLs and served here before the engine boots. -->
	<script type='text/javascript' src='index.pck.data.js'></script>
	<script type='text/javascript' src='index.wasm.data.js'></script>
	<script type='text/javascript'>
		(function () {
			const embedded = window.__IXION_EMBED__ || {};
			const nativeFetch = window.fetch.bind(window);
			window.fetch = function (input, init) {
				const url = typeof input === 'string' ? input : input.url;
				const name = String(url).split('?')[0].split('/').pop();
				if (Object.prototype.hasOwnProperty.call(embedded, name)) {
					return nativeFetch(embedded[name], init);
				}
				return nativeFetch(input, init);
			};
		})();
	</script>
	<script type='text/javascript'>//<![CDATA[
		// Layout-in-PNG helpers: the exported PNG carries the YAML in a tEXt chunk.
		var IXION_CRC_TABLE = (function () {
			var table = new Uint32Array(256);
			for (var n = 0; n < 256; n++) {
				var c = n;
				for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
				table[n] = c >>> 0;
			}
			return table;
		})();
		function ixionCrc32(bytes) {
			var crc = 0xFFFFFFFF;
			for (var i = 0; i < bytes.length; i++) crc = IXION_CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
			return (crc ^ 0xFFFFFFFF) >>> 0;
		}
		function ixionInjectLayout(bytes, yaml) {
			var keyword = 'ixion-layout';
			var text = new TextEncoder().encode(yaml);
			var data = new Uint8Array(keyword.length + 1 + text.length);
			for (var i = 0; i < keyword.length; i++) data[i] = keyword.charCodeAt(i);
			data[keyword.length] = 0;
			data.set(text, keyword.length + 1);
			var chunk = new Uint8Array(12 + data.length);
			var dv = new DataView(chunk.buffer);
			dv.setUint32(0, data.length);
			chunk[4] = 0x74; chunk[5] = 0x45; chunk[6] = 0x58; chunk[7] = 0x74; // tEXt
			chunk.set(data, 8);
			var crcInput = new Uint8Array(4 + data.length);
			crcInput.set(chunk.subarray(4, 8));
			crcInput.set(data, 4);
			dv.setUint32(8 + data.length, ixionCrc32(crcInput));
			var out = new Uint8Array(bytes.length + chunk.length);
			out.set(bytes.subarray(0, bytes.length - 12)); // before IEND
			out.set(chunk, bytes.length - 12);
			out.set(bytes.subarray(bytes.length - 12), bytes.length - 12 + chunk.length);
			return out;
		}
		function ixionExtractLayout(bytes) {
			if (bytes.length < 8 || bytes[0] !== 0x89 || bytes[1] !== 0x50) return null;
			var offset = 8;
			while (offset + 12 <= bytes.length) {
				var dv = new DataView(bytes.buffer, bytes.byteOffset + offset, 8);
				var len = dv.getUint32(0);
				var type = String.fromCharCode(bytes[offset + 4], bytes[offset + 5], bytes[offset + 6], bytes[offset + 7]);
				if (type === 'tEXt') {
					var start = offset + 8;
					var sep = start;
					while (sep < start + len && bytes[sep] !== 0) sep++;
					var keyword = '';
					for (var i = start; i < sep; i++) keyword += String.fromCharCode(bytes[i]);
					if (keyword === 'ixion-layout') {
						return new TextDecoder().decode(bytes.subarray(sep + 1, start + len));
					}
				}
				if (type === 'IEND') break;
				offset += 12 + len;
			}
			return null;
		}
		async function ixionSaveLayout(b64, yaml, base, wantYaml) {
			var bin = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
			var withLayout = ixionInjectLayout(bin, yaml);
			if (window.showSaveFilePicker) {
				try {
					var handle = await window.showSaveFilePicker({
						suggestedName: base + '.png',
						types: [
							{ description: 'IXION layout PNG', accept: { 'image/png': ['.png'] } },
							{ description: 'IXION layout YAML', accept: { 'text/yaml': ['.yaml'] } }
						]
					});
					var writable = await handle.createWritable();
					var name = handle.name.toLowerCase();
					await writable.write(name.endsWith('.yaml') || name.endsWith('.yml') ? yaml : withLayout);
					await writable.close();
					localStorage.setItem('ixion-builder-last-path', handle.name);
					return;
				} catch (e) {
					if (e && e.name === 'AbortError') return;
				}
			}
			var a = document.createElement('a');
			if (wantYaml) {
				a.href = URL.createObjectURL(new Blob([yaml], { type: 'text/yaml' }));
				a.download = base + '.yaml';
			} else {
				a.href = URL.createObjectURL(new Blob([withLayout], { type: 'image/png' }));
				a.download = base + '.png';
			}
			document.body.appendChild(a);
			a.click();
			a.remove();
			localStorage.setItem('ixion-builder-last-path', a.download);
		}
		function ixionPickImport() {
			var i = document.createElement('input');
			i.type = 'file';
			i.accept = '.png,.yaml,.yml';
			i.onchange = function (e) {
				var f = e.target.files[0];
				if (!f) return;
				localStorage.setItem('ixion-builder-last-path', f.name);
				var r = new FileReader();
				r.onload = function (ev) {
					var buf = new Uint8Array(ev.target.result);
					if (buf.length > 8 && buf[0] === 0x89 && buf[1] === 0x50) {
						var yaml = ixionExtractLayout(buf);
						if (yaml === null) {
							window.__ixion_import_error = 'PNG has no embedded layout.';
							return;
						}
						window.__ixion_import = yaml;
					} else {
						window.__ixion_import = new TextDecoder().decode(buf);
					}
				};
				r.readAsArrayBuffer(f);
			};
			i.click();
		}
	//]]></script>
	<script type='text/javascript' src='index.js'></script>
	<script type='text/javascript'>//<![CDATA[

		const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":341616,"index.wasm":17862218},"focusCanvas":true,"gdnativeLibs":[]};
		var engine = new Engine(GODOT_CONFIG);

		(function() {
			const INDETERMINATE_STATUS_STEP_MS = 100;
			var statusProgress = document.getElementById('status-progress');
			var statusProgressInner = document.getElementById('status-progress-inner');
			var statusIndeterminate = document.getElementById('status-indeterminate');
			var statusNotice = document.getElementById('status-notice');

			var initializing = true;
			var statusMode = 'hidden';

			var animationCallbacks = [];
			function animate(time) {
				animationCallbacks.forEach(callback => callback(time));
				requestAnimationFrame(animate);
			}
			requestAnimationFrame(animate);

			function setStatusMode(mode) {

				if (statusMode === mode || !initializing)
					return;
				[statusProgress, statusIndeterminate, statusNotice].forEach(elem => {
					elem.style.display = 'none';
				});
				animationCallbacks = animationCallbacks.filter(function(value) {
					return (value != animateStatusIndeterminate);
				});
				switch (mode) {
					case 'progress':
						statusProgress.style.display = 'block';
						break;
					case 'indeterminate':
						statusIndeterminate.style.display = 'block';
						animationCallbacks.push(animateStatusIndeterminate);
						break;
					case 'notice':
						statusNotice.style.display = 'block';
						break;
					case 'hidden':
						break;
					default:
						throw new Error('Invalid status mode');
				}
				statusMode = mode;
			}

			function animateStatusIndeterminate(ms) {
				var i = Math.floor(ms / INDETERMINATE_STATUS_STEP_MS % 8);
				if (statusIndeterminate.children[i].style.borderTopColor == '') {
					Array.prototype.slice.call(statusIndeterminate.children).forEach(child => {
						child.style.borderTopColor = '';
					});
					statusIndeterminate.children[i].style.borderTopColor = '#dfdfdf';
				}
			}

			function setStatusNotice(text) {
				while (statusNotice.lastChild) {
					statusNotice.removeChild(statusNotice.lastChild);
				}
				var lines = text.split('\n');
				lines.forEach((line) => {
					statusNotice.appendChild(document.createTextNode(line));
					statusNotice.appendChild(document.createElement('br'));
				});
			};

			function displayFailureNotice(err) {
				var msg = err.message || err;
				console.error(msg);
				setStatusNotice(msg);
				setStatusMode('notice');
				initializing = false;
			};

			if (!Engine.isWebGLAvailable()) {
				displayFailureNotice('WebGL not available');
			} else {
				setStatusMode('indeterminate');
				engine.startGame({
					'onProgress': function (current, total) {
						if (total > 0) {
							statusProgressInner.style.width = current/total * 100 + '%';
							setStatusMode('progress');
							if (current === total) {
								// wait for progress bar animation
								setTimeout(() => {
									setStatusMode('indeterminate');
								}, 500);
							}
						} else {
							setStatusMode('indeterminate');
						}
					},
				}).then(() => {
					setStatusMode('hidden');
					initializing = false;
				}, displayFailureNotice);
			}
		})();
	//]]></script>
</body>
</html>
